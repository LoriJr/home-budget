services:
  home-budget:
    image: postgres:15
    container_name: home-budget
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5450:5432"
    volumes:
      - home-budget_data:/var/lib/postgresql
volumes:
  home-budget_data:
